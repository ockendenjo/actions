name: zizmor

on:
  push:
    branches: ["main"]
  pull_request:
    branches:
      - main

jobs:
  zizmor:
    name: Run zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read         # Only needed for private repos. Needed to clone the repo.
    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Download zizmor
        shell: bash
        run: |
          wget -nv https://github.com/zizmorcore/zizmor/releases/download/v1.26.1/zizmor-x86_64-unknown-linux-gnu.tar.gz
          echo "277f2bd8fd37cf60c42ab7afca6faa884e65440fa31e02b44bdaae60f62a358f  zizmor-x86_64-unknown-linux-gnu.tar.gz" | sha256sum --check
          tar -xvzf zizmor-x86_64-unknown-linux-gnu.tar.gz

      - name: Run zizmor
        shell: bash
        run: |
          ./zizmor ./.github/
