name: SAST

on:
  workflow_call: {}

permissions: {}

jobs:
  scan:
    name: Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"

      - name: Download Go packages
        shell: bash
        run: |
          go get ./...

      - name: Go fix
        shell: bash
        run: |
          go fix -diff ./...

      - name: Download config
        shell: bash
        run: |
          wget https://raw.githubusercontent.com/ockendenjo/actions/refs/heads/main/.golangci.json

      - name: golangci-lint # https://github.com/golangci/golangci-lint-action
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: latest

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@709015412431dd2b5b28a53c06c70bc02d49074c # v1.8.0

      - name: govulncheck
        shell: bash
        run: |
          govulncheck ./...
